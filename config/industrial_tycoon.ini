; Experimental industries without staff. UTF-8 without BOM.
; Does not create citizens or change the building definitions.
[industrial_tycoon]
enabled=1
; Fire service without staff (trucks dispatch and extinguish with a virtual crew).
fire_service=1
; Crew used when a truck's own fire skill value is unusable (1..20).
virtual_firefighters=4
; Container facilities, hand-worked fields, control towers and water wells work with their full staff
; when nobody is there.
container_facility=1
fields=1
control_tower=1
water_well=1
; Vehicle repair stations repair with their full staff when nobody is there.
repair_station=1
; Construction offices use concrete and asphalt plants with their inputs as sources even without staff.
plant_sources=1

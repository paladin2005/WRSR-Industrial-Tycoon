; Locally rebuilt upstream loader for Industrial Tycoon.
; game_exe stays empty: the launcher finds the game by walking up from its own folder (or through
; Steam, or Browse) and saves the path here on first start.
[tesmioloader]
version=b0.3.6-industrial-experimental
version_check=1
game_exe=
plugins=1
vfs=0
log_game=1
trace_reads=0
probe_map=0
probe_texel=0
save_manifest=0
menu_patch=0

[plugins]
industrial_tycoon=1
industrial_construction=1
